[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "subex"
version = "0.1.0"
description = "영상에 들어 있는 자막 트랙을 SRT 로 추출한다 (이미지 자막은 OCR 경유)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pillow>=9.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
subex = "subex.cli:main"

[tool.setuptools]
packages = ["subex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
