name: 웹판 배포 (GitHub Pages)

# web/ 폴더를 정적 사이트로 올린다. 서버에서 도는 프로그램은 없다.
#
# 문자 인식 엔진(tesseract.js)과 한국어·영어 언어 자료는 저장소에 담아 두지 않고
# 배포할 때마다 받아서 함께 올린다. 그래야 저장소는 가볍고, 올라간 사이트는
# 바깥 배포망에 기대지 않고 혼자 돌아간다.

on:
  push:
    branches: [claude/loving-planck-exzcta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 뒤엣것을 기다리게 한다(중간에 끊지 않는다).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 문자 인식 엔진 준비
        working-directory: web
        # --ignore-scripts: playwright 가 브라우저(수백 MB)를 받으려 하는 것을 막는다.
        # 여기서는 vendor 를 만드는 데 tesseract.js 파일만 있으면 된다.
        run: |
          npm ci --ignore-scripts
          npm run vendor

      - name: 올릴 파일 모으기
        run: |
          mkdir -p _site
          cp web/index.html web/styles.css _site/
          cp -r web/src _site/src
          cp -r web/vendor _site/vendor
          # Jekyll 이 밑줄로 시작하는 이름을 건너뛰지 않도록.
          touch _site/.nojekyll
          echo "올라갈 크기: $(du -sh _site | cut -f1)"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
