<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영상 자막 추출</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page">
  <header class="head">
    <h1>영상 자막 추출</h1>
    <p class="lead">
      영상에 들어 있는 자막을 SRT 파일로 뽑습니다. 자막이 그림으로 들어 있으면
      글자로 읽어 냅니다. <strong>영상은 이 기기 밖으로 나가지 않습니다.</strong>
    </p>
  </header>

  <section>
    <label class="drop" id="drop" for="file">
      <input type="file" id="file" accept="video/*,.mkv,.webm,.mp4,.mov,.m4v,.sup" hidden>
      <span class="drop-title">영상 파일을 고르거나 여기에 끌어다 놓으세요</span>
      <span class="drop-note">MKV · WebM · MP4 · MOV, 그리고 .sup 자막 파일</span>
    </label>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="bar" id="bar" hidden><div class="bar-fill" id="barFill"></div></div>

    <details class="settings">
      <summary>그림 자막 인식 설정</summary>
      <div class="settings-body">
        <label>
          <span>인식 언어</span>
          <select id="ocrLang">
            <option value="auto" selected>자동 — 앞부분을 견줘 보고 고름 (기본)</option>
            <option value="kor+eng">한국어 + 영어</option>
            <option value="kor">한국어만 — 한글만 있는 자막에 더 정확</option>
            <option value="eng">영어만</option>
          </select>
        </label>
        <label>
          <span>확대 배율</span>
          <select id="ocrScale">
            <option value="2" selected>2배 — 빠름 (기본)</option>
            <option value="3">3배 — 보통</option>
            <option value="4">4배 — 글자가 작을 때</option>
          </select>
        </label>
        <p class="settings-note">
          한글만 있는 자막은 '한국어만'이 눈에 띄게 정확하고(실측 98.0% 대 89.7%),
          영문이 섞여 있으면 반대로 '한국어만'이 영문을 깨뜨립니다. '자동'은 앞부분
          몇 장을 양쪽으로 읽어 보고 더 잘 읽히는 쪽을 고릅니다.
        </p>
      </div>
    </details>
  </section>

  <section id="trackSection" hidden>
    <h2>자막 트랙</h2>
    <ul class="tracks" id="tracks"></ul>
    <button class="primary" id="extract" type="button">선택한 자막 추출</button>
  </section>

  <section id="resultSection" hidden>
    <h2>결과</h2>
    <ul class="results" id="results"></ul>
  </section>

  <footer class="foot">
    <p>
      처리는 전부 이 브라우저 안에서 이뤄집니다. 파일을 서버로 올리지 않습니다.
    </p>
  </footer>
</main>

<script type="module" src="src/app.js"></script>
</body>
</html>
