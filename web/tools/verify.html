<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>검증용 실행기</title></head>
<body>
<input type="file" id="file">
<pre id="out">준비 중…</pre>

<script type="module">
// tools/verify.js 가 브라우저 안에서 실제 처리 과정을 돌려 보기 위한 껍데기다.
// 화면(app.js)을 거치지 않고 모듈을 직접 불러 쓰므로, 중간 결과(해독한 그림)
// 까지 꺼내 볼 수 있다.

import { ensureTesseract } from '../src/config.js';
import {
  describeTrack,
  formatName,
  isBitmap,
  isSupported,
  listTracks,
  readTrackCues,
  uniqueFileName,
} from '../src/extract.js';
import { decodeSupFile } from '../src/pgs.js';
import { prepareForOcr } from '../src/bitmapPrep.js';
import { OcrPool, pickLanguage } from '../src/ocr.js';
import { tidy } from '../src/postprocess.js';
import { render } from '../src/srt.js';

async function toDataUrl(image) {
  const canvas = new OffscreenCanvas(image.width, image.height);
  canvas.getContext('2d').putImageData(new ImageData(image.data, image.width, image.height), 0, 0);
  const blob = await canvas.convertToBlob({ type: 'image/png' });
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(blob);
  });
}

window.runVerify = async function runVerify({ language = 'kor+eng', scale = 2, dumpCount = 0 } = {}) {
  const file = document.getElementById('file').files[0];
  const started = performance.now();

  const probeStart = performance.now();
  const { container, tracks, context } = await listTracks(file);
  const probeMs = performance.now() - probeStart;

  const report = {
    fileName: file.name,
    fileSize: file.size,
    container,
    probeMs,
    tracks: tracks.map((track) => ({
      description: describeTrack(track),
      mimeType: track.mimeType,
      formatName: formatName(track.mimeType),
      language: track.language,
      bitmap: isBitmap(track),
      supported: isSupported(track),
    })),
    results: [],
    dumps: [],
  };

  let pool = null;
  const usedNames = new Set();

  try {
    for (const track of tracks) {
      if (!isSupported(track)) continue;

      const readStart = performance.now();
      const cues =
        container === 'sup'
          ? decodeSupFile(new Uint8Array(await file.arrayBuffer()))
          : await readTrackCues(file, track, container, context);
      const readMs = performance.now() - readStart;

      let ocrMs = 0;
      let textCues = cues;

      if (cues.some((cue) => cue.image)) {
        const images = cues.filter((cue) => cue.image).map((cue) => prepareForOcr(cue.image, { scale }));
        if (!pool) {
          const started = await start(language, images);
          pool = started.pool;
          report.languageDecision = started.decision;
          report.language = started.language;
        }

        // 무엇을 보고 읽었는지 눈으로 확인할 수 있게 앞쪽 몇 장을 그림으로 넘긴다.
        for (let index = 0; index < Math.min(dumpCount, images.length); index += 1) {
          report.dumps.push({
            track: track.subtitleIndex,
            index,
            raw: await toDataUrl(cues.filter((cue) => cue.image)[index].image),
            prepared: await toDataUrl(images[index]),
          });
        }

        const ocrStart = performance.now();
        const texts = await pool.recognizeAll(images);
        ocrMs = performance.now() - ocrStart;

        let order = 0;
        textCues = cues.map((cue) => (cue.image ? { ...cue, text: texts[order++] } : cue));
      }

      const tidied = tidy(
        textCues.map(({ startMs, endMs, text }) => ({ startMs, endMs, text: text ?? '' })),
        { stripStyling: !isBitmap(track) },
      );

      const name = uniqueFileName(file.name, track, usedNames);
      usedNames.add(name);
      report.results.push({
        name,
        subtitleIndex: track.subtitleIndex,
        bitmap: isBitmap(track),
        cueCount: tidied.length,
        rawCueCount: cues.length,
        readMs,
        ocrMs,
        srt: render(tidied),
      });
    }
  } finally {
    await pool?.terminate();
  }

  report.totalMs = performance.now() - started;
  return report;
};

async function start(language, images) {
  const assets = await ensureTesseract();

  let chosen = language;
  let decision = null;
  if (language === 'auto') {
    decision = await pickLanguage(assets, images);
    chosen = decision.language;
  }
  return { pool: await OcrPool.create(assets, { language: chosen }), language: chosen, decision };
}

document.getElementById('out').textContent = 'ready';
</script>
</body>
</html>
